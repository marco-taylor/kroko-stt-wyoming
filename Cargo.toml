[package]
name = "kroko-stt-wyoming"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Multilingual streaming speech-to-text with Kroko, sherpa-onnx, Rust and Wyoming"
autobins = false
autoexamples = false
[dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
hound = "3.5.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
libc = "0.2"
sha2 = "=0.10.9"

[[bin]]
name = "kroko-wyoming"
path = "src/server/main.rs"
[[bin]]
name = "model-manager"
path = "src/bin/model-manager.rs"

[[bin]]
name = "wyoming-probe"
path = "src/bin/wyoming-probe.rs"

[profile.release]
lto = "thin"
codegen-units = 1
